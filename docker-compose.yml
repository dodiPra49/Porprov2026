services:
  # 1. Nginx Reverse Proxy / API Gateway
  porprov_proxy:
    image: nginx:alpine
    container_name: porprov_proxy
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - porprov_admin
      - porprov_api
      - porprov_frontend
    networks:
      - porprov_net

  # 2. Laravel 11 Admin Panel
  porprov_admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: porprov_admin
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:00kgijEp6vnC01UoJBaMbP4E5AQiIHa1gekd5U2V62c=
      DB_CONNECTION: mysql
      DB_HOST: porprov_db
      DB_PORT: 3306
      DB_DATABASE: porprov-2026
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:qwertyzaq}
      SESSION_DRIVER: file
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      porprov_db:
        condition: service_healthy
    command: sh -c "php artisan config:clear && php artisan config:cache && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
    networks:
      - porprov_net

  # 3. Express.js REST API Backend
  porprov_api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: porprov_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: porprov_db
      DB_PORT: 3306
      DB_DATABASE: porprov-2026
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      JWT_SECRET: ${JWT_SECRET:-PorprovSumbar2026SuperSecretKeyJWTTokenSecurity!}
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      porprov_db:
        condition: service_healthy
    networks:
      - porprov_net

  # 4. Next.js Public Portal
  porprov_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: porprov_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://porprov_api:5000/api/v1
    depends_on:
      - porprov_api
    networks:
      - porprov_net

  # 5. MySQL Database (versi 8.0.32 kompatibel dengan CPU tanpa instruksi x86-64-v2)
  porprov_db:
    image: mysql:8.0.32
    container_name: porprov_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: porprov-2026
    ports:
      - "3308:3306"
    volumes:
      - mysql_porprov_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$${MYSQL_ROOT_PASSWORD}\" || mysqladmin ping -h 127.0.0.1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - porprov_net

  # 6. phpMyAdmin Database GUI
  porprov_phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: porprov_phpmyadmin
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      PMA_HOST: porprov_db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      porprov_db:
        condition: service_healthy
    networks:
      - porprov_net

networks:
  porprov_net:
    driver: bridge

volumes:
  mysql_porprov_data:
