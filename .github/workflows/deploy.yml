name: Deploy to VPS Linux

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Memulai proses deploy ke VPS..."

            TARGET_DIR="${{ secrets.VPS_TARGET_DIR || '/var/www/porprov-2026' }}"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            # Pastikan folder target ada dan masuk ke dalamnya
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            # Hindari error 'dubious ownership' di git Linux
            git config --global --add safe.directory "$TARGET_DIR" || true

            # Jika belum ada repository git, inisialisasi otomatis
            if [ ! -d ".git" ]; then
              echo "⚙️ Direktori belum terhubung ke Git. Menginisialisasi repositori Git..."
              git init
              git branch -M main || true
              git remote add origin "$REPO_URL" || git remote set-url origin "$REPO_URL"
            fi

            # Ambil pembaruan kode terbaru dari GitHub
            echo "📥 Menarik kode terbaru dari branch main..."
            git fetch --all
            git reset --hard origin/main
            git branch --set-upstream-to=origin/main main || true

            # Pastikan script deploy dapat dieksekusi
            chmod +x deploy.sh

            # Jalankan script deploy
            echo "⚙️ Menjalankan deploy.sh..."
            ./deploy.sh

            echo "✅ Deployment berhasil diselesaikan!"
