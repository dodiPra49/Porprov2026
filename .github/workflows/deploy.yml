name: Deploy to VPS Linux

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Memulai proses deploy ke VPS..."

            # Masuk ke direktori proyek di VPS
            TARGET_DIR="${{ secrets.VPS_TARGET_DIR || '/var/www/porprov-2026' }}"
            cd "$TARGET_DIR"

            # Ambil pembaruan kode terbaru dari GitHub
            echo "📥 Menarik kode terbaru dari branch main..."
            git fetch --all
            git reset --hard origin/main

            # Pastikan script deploy dapat dieksekusi
            chmod +x deploy.sh

            # Jalankan script deploy
            echo "⚙️ Menjalankan deploy.sh..."
            ./deploy.sh

            echo "✅ Deployment berhasil diselesaikan!"
