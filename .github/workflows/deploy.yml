name: Deploy to VPS Linux

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            echo "🚀 [1/5] Memulai proses deploy ke VPS..."

            TARGET_DIR="${{ secrets.VPS_TARGET_DIR || '/var/www/porprov-2026' }}"
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

            # Pastikan direktori tujuan tersedia dan dapat ditulis oleh user SSH
            echo "📂 [2/5] Memverifikasi direktori target: $TARGET_DIR..."
            if [ ! -d "$TARGET_DIR" ]; then
              echo "📁 Direktori belum ada, membuat direktori..."
              mkdir -p "$TARGET_DIR" 2>/dev/null || sudo mkdir -p "$TARGET_DIR" 2>/dev/null || true
            fi

            # Pastikan user SSH memiliki izin tulis ke folder tersebut
            if [ ! -w "$TARGET_DIR" ]; then
              echo "🔑 Menyesuaikan hak akses kepemilikan ke $USER..."
              sudo chown -R $USER:$USER "$TARGET_DIR" 2>/dev/null || true
              sudo chmod -R 775 "$TARGET_DIR" 2>/dev/null || true
            fi

            cd "$TARGET_DIR"

            # Hindari error 'dubious ownership' di git Linux
            git config --global --add safe.directory "$TARGET_DIR" 2>/dev/null || true

            # Inisialisasi git repository jika belum terhubung
            if [ ! -d ".git" ]; then
              echo "⚙️ [3/5] Menginisialisasi repositori Git baru..."
              git init
              git branch -M main || true
              git remote add origin "$REPO_URL" || git remote set-url origin "$REPO_URL"
            else
              echo "ℹ️ [3/5] Repositori Git ditemukan, memperbarui remote URL..."
              git remote set-url origin "$REPO_URL" || true
            fi

            # Ambil pembaruan kode terbaru dari GitHub
            echo "📥 [4/5] Menarik kode terbaru dari branch main..."
            git fetch origin main --prune
            git reset --hard origin/main
            git branch --set-upstream-to=origin/main main || true

            # Eksekusi deploy.sh
            echo "⚙️ [5/5] Memeriksa dan menjalankan deploy.sh..."
            if [ -f deploy.sh ]; then
              chmod +x deploy.sh
              ./deploy.sh
            else
              echo "⚠️ deploy.sh tidak ditemukan, deployment dilewati."
            fi

            echo "✅ Deployment berhasil diselesaikan!"
